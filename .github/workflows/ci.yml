name: CI

# The three gates that have to be green before anything is committed locally,
# enforced on every push. The training extras are deliberately not installed:
# torch is gigabytes, and nothing in the test suite needs it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: ruff / mypy / pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify Linux secure-search prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo -n true
          test -d /proc/self/fd
          test "$(findmnt --noheadings --output FSTYPE --target "$GITHUB_WORKSPACE")" = ext4
          python - <<'PY'
          import os
          from pathlib import Path

          required = ("O_PATH", "O_NOFOLLOW", "O_DIRECTORY", "O_CLOEXEC")
          missing = [name for name in required if not hasattr(os, name)]
          if missing or os.open not in os.supports_dir_fd or os.scandir not in os.supports_fd:
              raise SystemExit(f"Linux secure-search APIs unavailable: {missing}")
          fd = os.open(".", os.O_RDONLY | os.O_DIRECTORY)
          try:
              fdinfo = Path(f"/proc/self/fdinfo/{fd}").read_text(encoding="ascii")
              if not any(line.startswith("mnt_id:") for line in fdinfo.splitlines()):
                  raise SystemExit("Linux procfs fdinfo mnt_id is unavailable")
          finally:
              os.close(fd)
          PY

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type-check
        run: mypy

      - name: Test
        run: pytest -rs --basetemp=.pytest-tmp
